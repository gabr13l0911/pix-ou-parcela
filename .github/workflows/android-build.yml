name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: pix-ou-parcela
  ANDROID_DIR: android

jobs:
  build:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor web assets into Android project
        run: |
          npm ci
          npm run build:web
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ${{ env.ANDROID_DIR }}/gradlew

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        id: rename
        run: |
          SRC=$(find ${ANDROID_DIR}/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::Nenhum APK encontrado em ${ANDROID_DIR}/app/build/outputs/apk/debug"
            exit 1
          fi
          DEST="${ANDROID_DIR}/app/build/outputs/apk/debug/${APP_NAME}-${GITHUB_REF_NAME}.apk"
          mv "$SRC" "$DEST"
          echo "apk_path=$DEST"  >> "$GITHUB_OUTPUT"
          echo "apk_name=${APP_NAME}-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk_path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
